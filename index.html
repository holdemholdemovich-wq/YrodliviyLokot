<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#12052b">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Уродец">
<title>Мой Говорящий Уродец</title>
<style>
:root{color-scheme:dark;--gold:#ffd86b;--line:rgba(255,216,107,.35);--bg:#0b0618}
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;touch-action:pan-x pan-y;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
/* HUD */
#hud{order:1;flex-shrink:0;z-index:10;position:relative;padding:8px 10px 10px;background:linear-gradient(180deg,rgba(38,18,84,.96),rgba(18,8,42,.94));border-bottom:2px solid var(--line);box-shadow:0 8px 26px #000b;border-radius:0 0 22px 22px;display:flex;flex-direction:column;gap:6px}
.r1{display:flex;gap:6px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:5px 10px;font-weight:800;font-size:13px;white-space:nowrap}
.chip.coin{background:linear-gradient(135deg,#ffd86b,#ff9f1c);color:#4a2c00;border-color:#fff6;box-shadow:0 2px 0 #b8660a,0 0 14px #ffb42e66;font-size:15px}
.chip.skin{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--gold);justify-content:center}
.chip.ic{padding:5px 9px;font-size:15px;cursor:pointer}
.chip.ic.off{opacity:.45}
.bars{display:flex;gap:6px;justify-content:space-between}
.b{flex:1;display:flex;align-items:center;gap:4px;font-size:12px}
.t{flex:1;height:10px;background:#12052a;border-radius:6px;overflow:hidden;box-shadow:inset 0 2px 3px #000a;border:1px solid #ffffff1a}.t i{display:block;height:100%;transition:width .3s;border-radius:6px;box-shadow:inset 0 3px 3px #fff5}
#xpbar{position:relative;height:14px;background:#12052a;border-radius:8px;overflow:hidden;border:1px solid #ffffff22}
#xpbar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#5ad1ff,#a34dff);transition:width .3s}
#xpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;text-shadow:0 1px 2px #000}
#combo-wrap{display:flex;align-items:center;gap:8px}
#combo-bar-bg{flex:1;height:7px;background:#0008;border-radius:4px;overflow:hidden;border:1px solid #ffffff22}
#combo-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#ffd93d,#ff3b3b);transition:width .1s}
#combo-text{font-size:11px;color:#ffd93d;font-weight:800;min-width:120px;text-align:right}

/* Сцена */
#scene-container{order:2;flex:1 1 auto;min-height:0;width:100%;position:relative;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;cursor:pointer;touch-action:none;background:#1e2226}
.grain{position:absolute;inset:0;z-index:5;opacity:.1;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E")}
#figure-container{position:absolute;inset:0;display:flex;justify-content:center;align-items:flex-end;pointer-events:none}
#figure-container svg{width:100%;height:100%;display:block}
#vig{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .4s;box-shadow:inset 0 0 120px 30px #ff1a3c}
#vig.on{opacity:.55;animation:vig 1s ease-in-out infinite}
@keyframes vig{50%{opacity:.25}}
#state{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:6;display:none;flex-direction:column;align-items:center;gap:4px;pointer-events:none;text-align:center;width:min(92%,340px)}
#state.on{display:flex}
#state .ttl{font-weight:900;font-size:19px;letter-spacing:.5px;color:#fff;text-shadow:0 2px 0 #000,0 0 14px #ff3b6b}
#state .sub{font-size:12px;color:#ffd0d8;text-shadow:0 1px 2px #000}
.ring{position:relative;width:104px;height:104px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:rgba(10,0,20,.6);stroke:#ffffff22;stroke-width:9}
.ring .fg{fill:none;stroke:url(#rgrad);stroke-width:9;stroke-linecap:round;stroke-dasharray:289;stroke-dashoffset:289;transition:stroke-dashoffset .15s;filter:drop-shadow(0 0 6px #ff3b6b)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.ring .num small{font-size:11px;opacity:.8}
.ring.pulse{animation:rp .18s}
@keyframes rp{50%{transform:scale(1.12)}}
.heart{font-size:22px;animation:hb .8s infinite}
@keyframes hb{20%{transform:scale(1.3)}40%{transform:scale(1)}}
#sbar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:6;display:none;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:min(92%,360px);background:rgba(8,40,70,.82);border:2px solid #5ad1ff;border-radius:16px;padding:7px 12px;box-shadow:0 0 18px #5ad1ff88;font-weight:800;font-size:13px;text-align:center}
#sbar.on{display:flex}
#sbar .wb{width:100%;height:10px;background:#04162a;border-radius:6px;overflow:hidden}
#sbar .wb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ad1ff,#2e8bff)}

/* Нижняя панель */
#pn{order:3;position:relative;z-index:8;flex:0 0 auto;display:flex;gap:8px;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#2a1260,#110626);border-top:2px solid var(--line);scrollbar-width:none;touch-action:pan-x;overscroll-behavior-x:contain}
#pn::-webkit-scrollbar{display:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
.pb{flex:1 0 auto;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:74px;background:linear-gradient(180deg,#fff,#ffd6ea);border:3px solid #a12048;border-radius:18px;padding:7px 10px;font-weight:900;font-size:13px;color:#3d1280;box-shadow:0 4px 0 #a12048;transition:transform .12s,box-shadow .12s,filter .2s}
.pb span.i{font-size:22px;line-height:1}
.pb:active{transform:translateY(3px);box-shadow:0 1px 0 #a12048}
.pb.on{background:linear-gradient(180deg,#9dffb8,#2ee06a);border-color:#0b7a33;box-shadow:0 4px 0 #0b7a33,0 0 18px #2ee06aaa;color:#04381a}
.pb.on::after{content:"ВКЛ";position:absolute;top:-8px;right:-4px;background:#ff3b3b;color:#fff;font-size:10px;padding:2px 6px;border-radius:9px;border:2px solid #fff;animation:bd 1s infinite}
@keyframes bd{50%{transform:scale(1.15)}}

/* Модальное окно */
#ov{position:fixed;inset:0;background:rgba(6,1,16,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;z-index:25;padding:14px 10px calc(14px + env(safe-area-inset-bottom,0px));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
#ov.on{display:block}
#box{background:linear-gradient(180deg,#24104d,#150838);border:2px solid var(--gold);border-radius:24px;width:min(620px,100%);padding:16px;margin:0 auto;text-align:center;box-shadow:0 0 0 5px #ffd86b22,0 30px 70px #000c,inset 0 0 40px #a34dff22;animation:pp .25s}
#box h2{color:var(--gold);margin-bottom:10px;font-size:22px;text-shadow:0 0 14px #ffd86b88}
@keyframes pp{from{transform:scale(.88) translateY(10px);opacity:0}}
.lv{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:9px 12px;margin:7px 0;text-align:left;flex-wrap:wrap}
.lv.cur{border-color:var(--gold);box-shadow:0 0 14px #ffd86b55}
.lv b{flex:1;font-size:14px;min-width:110px}
.lv small{color:#ffd86bcc;display:block;font-size:11px;font-weight:normal;margin-top:2px}
.lv .bn{color:#7dffb0}
.actions{display:flex;gap:6px}
.skin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.skin-card{background:linear-gradient(180deg,#2a1560,#170a3a);border:2px solid #ffffff22;border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.skin-card.locked{filter:grayscale(1);opacity:.7}
.skin-model{width:84px;height:84px;margin-bottom:5px}
.skin-name{font-size:14px;font-weight:800}
.skin-mult{font-size:12px;font-weight:800;color:var(--gold);margin-top:2px}
.skin-rarity{font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.skin-xp{font-size:11px;color:#aaa;margin-top:4px}
.r-common{color:#aaa}.r-uncommon{color:#2ea44f}.r-rare{color:#2e8bff}
.go{background:linear-gradient(#ffe27a,#ffb800);border:3px solid #b8860b;border-radius:14px;padding:8px 14px;font-weight:900;color:#5a3a00;box-shadow:0 3px 0 #b8860b;white-space:nowrap;min-height:40px;font-size:14px;transition:transform .1s}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #b8860b}
.go.sec{background:linear-gradient(#7ec8ff,#2e8bff);border-color:#1c5fa8;color:#fff;box-shadow:0 3px 0 #1c5fa8}
.go.red{background:linear-gradient(#ff6b6b,#c92a2a);border-color:#8b0000;color:#fff;box-shadow:0 3px 0 #8b0000}
.go.dis{filter:grayscale(.8);opacity:.6}
.closeBar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.floating-text{position:fixed;color:#ffd93d;font-weight:900;font-size:26px;pointer-events:none;z-index:100;text-shadow:0 2px 4px #000,0 0 10px #ffd93d;animation:floatUp .8s ease-out forwards;will-change:transform,opacity}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(1.4)}}
#ts{position:fixed;top:calc(78px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:200;pointer-events:none;display:flex;flex-direction:column;gap:5px;align-items:center;max-width:92vw}
.ts{background:linear-gradient(#ffe27a,#ffb800);border:3px solid #b8860b;color:#5a3a00;font-weight:900;padding:6px 14px;border-radius:14px;animation:a 2.2s forwards;font-size:14px;box-shadow:0 4px 14px #0008}
@keyframes a{0%{opacity:0;transform:scale(.5)}12%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}

/* Меню */
#menu{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#4b1b91,#190a3d 60%,#07020f);overflow:hidden;touch-action:none}
#menu.off{display:none}
.mbg{position:absolute;inset:-50%;background:conic-gradient(from 0deg,#a34dff22,transparent,#ffd86b18,transparent,#2e8bff22,transparent);animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;text-align:center}
#mhead{width:150px;height:150px;animation:flt 3s ease-in-out infinite;filter:drop-shadow(0 10px 20px #000a)}
@keyframes flt{50%{transform:translateY(-12px) rotate(3deg)}}
#menu h1{font-size:clamp(28px,8vw,46px);line-height:1;color:#fff;text-shadow:0 4px 0 #6a2bd0,0 0 30px #a34dffaa;letter-spacing:1px}
#menu h1 span{color:var(--gold);text-shadow:0 4px 0 #b8660a,0 0 30px #ffb42eaa}
#menu p{color:#cdb8ff;font-size:14px}
.play{background:linear-gradient(#9dffb8,#1fd25f);border:4px solid #0b7a33;border-radius:22px;padding:14px 46px;font-size:24px;font-weight:900;color:#04381a;box-shadow:0 6px 0 #0b7a33,0 0 28px #2ee06a88;animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.06)}}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #0b7a33}
.mrow{display:flex;gap:8px}
/* ===== Полировка ===== */
#scene-container{contain:layout paint}
#hud{background:linear-gradient(180deg,#3d1b86f2,#160834f5);border-bottom:2px solid var(--gold);box-shadow:0 10px 30px #000c,0 0 0 1px #ffffff14 inset}
.av{width:48px;height:48px;flex:0 0 48px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#7a45e0,#1b0a45);border:3px solid var(--gold);box-shadow:0 0 16px #ffd86b88,inset 0 0 10px #000a;overflow:hidden;padding:2px}
.who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.who b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--gold);font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{background:rgba(255,255,255,.07);border:1px solid #ffffff14;border-radius:11px;padding:3px 7px}
.b.low{animation:low .8s infinite}@keyframes low{50%{background:rgba(255,40,70,.4)}}
.t i{background-image:linear-gradient(180deg,#fff6,transparent 60%)}
.pb{background:linear-gradient(180deg,#5a33b4,#2a1366);border:2px solid #ffffff33;border-radius:20px;color:#fff;box-shadow:0 5px 0 #0e0426,inset 0 2px 0 #ffffff44;overflow:hidden;min-width:80px;text-shadow:0 2px 2px #0008}
.pb::before{content:"";position:absolute;inset:0 0 55% 0;background:linear-gradient(#ffffff30,transparent)}
.pb:active{box-shadow:0 1px 0 #0e0426}
.pb.on{background:linear-gradient(180deg,#9dffb8,#1fc95c);color:#04381a;text-shadow:none;border-color:#eaffef}
.pb.on::after{top:4px;right:4px}
.go{position:relative;overflow:hidden;text-shadow:0 1px 0 #fff6}
.go::before{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(#ffffff55,transparent)}
.lv{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border-radius:18px;box-shadow:0 4px 12px #0006}
.skin-card{box-shadow:0 6px 14px #0008,inset 0 0 22px #a34dff22}
#box{background:radial-gradient(circle at 50% 0,#3a1a7a,#150838 70%)}
#xb{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:27;width:40px;height:40px;border-radius:50%;background:linear-gradient(#ff6b6b,#c92a2a);border:3px solid #fff;font-size:18px;font-weight:900;box-shadow:0 4px 14px #000a;display:none}
#ov.on #xb{display:block}
#menu::before{content:"";position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 20%,#ffd86b,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),radial-gradient(2px 2px at 85% 65%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 80%,#ffd86b,transparent),radial-gradient(1.5px 1.5px at 55% 45%,#fff,transparent);animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
.floating-text{will-change:transform,opacity;contain:layout}
#figure-container svg{position:absolute;inset:0}
#dyn{will-change:transform;transform:translateZ(0)}
#stat{contain:strict}
#night{position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at 20% 85%,rgba(255,214,140,.14),rgba(4,6,28,.8) 62%);opacity:0;transition:opacity 1.2s;pointer-events:none}#night.on{opacity:1}
.sep{display:flex;align-items:center;gap:10px;margin:16px 0 6px;color:#ff9aa8;font-weight:900;font-size:13px;letter-spacing:1px}.sep::before,.sep::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,#ff9aa8aa,transparent)}
.floating-text{left:0;top:0;opacity:0;animation:none;text-shadow:0 2px 0 #000}
#sbar{top:34%;bottom:auto;left:auto;right:6px;transform:none;width:58px;padding:8px 6px;border-radius:16px;gap:6px;font-size:12px;opacity:.9}
#sbar .wb{width:16px;height:120px;display:flex;align-items:flex-end;border-radius:8px}
#sbar .wb i{width:100%;height:0;background:linear-gradient(0deg,#2e8bff,#5ad1ff)}
/* ===== Правки по скриншоту ===== */
.av{width:50px;height:50px;flex-basis:50px}
.who b{font-size:15px}
.chip.coin{font-size:16px;padding:6px 12px}
.b{flex-direction:column;align-items:stretch;gap:3px;padding:4px 6px 5px;font-size:13px;text-align:center;line-height:1}
.b .t{width:100%;height:9px;flex:none}
#pn{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;overflow:visible;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));touch-action:manipulation}
.pb{min-width:0;padding:6px 2px;font-size:12px;border-radius:16px;box-shadow:0 4px 0 #0e0426,inset 0 2px 0 #ffffff44}
.pb span.i{font-size:21px}
@media (min-width:760px) and (min-aspect-ratio:1/1){#pn{grid-template-columns:repeat(8,1fr)}}
/* ===== Вау-эффекты ===== */
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:7;pointer-events:none}
#scene-container::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 62%,transparent 55%,rgba(0,0,0,.5) 100%)}
.av{border:none;padding:4px;overflow:visible;position:relative;background:conic-gradient(#ffd86b var(--p,0%),#3a2280 0);box-shadow:0 0 16px #ffd86b66}
.av::before{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#7a45e0,#1b0a45)}
.av svg{position:relative;border-radius:50%}
.pb.alert:not(.on)::after{content:"!";position:absolute;top:3px;right:6px;width:17px;height:17px;border-radius:50%;background:#ff3b3b;color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;animation:bd 1s infinite}
.pb.alert:not(.on) .i{animation:wob .7s infinite}
@keyframes wob{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.ts.bad{background:linear-gradient(#ff8a8a,#e03a3a);border-color:#8b0000;color:#fff}
.ts.good{background:linear-gradient(#a8ffc0,#2ee06a);border-color:#0b7a33;color:#04381a}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{flex:1;padding:9px;border-radius:14px;background:rgba(255,255,255,.08);border:2px solid #ffffff22;font-weight:900;font-size:14px;color:#fff}
.tab.on{background:linear-gradient(#ffe27a,#ffb800);color:#5a3a00;border-color:#b8860b}
.own{background:#2ee06a;color:#04381a;border-radius:8px;padding:1px 6px;font-size:11px;font-weight:900;margin-left:4px}
.pbar{height:6px;background:#0007;border-radius:4px;margin-top:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#5ad1ff,#a34dff)}
#evo{position:fixed;inset:0;z-index:260;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;background:radial-gradient(circle,rgba(255,216,107,.28),transparent 62%)}
.evo-t{font-size:clamp(30px,10vw,54px);font-weight:900;color:#fff;text-shadow:0 4px 0 #6a2bd0,0 0 30px #a34dff}
.evo-n{font-size:clamp(24px,8vw,40px);font-weight:900;color:var(--gold);text-shadow:0 4px 0 #b8660a,0 0 24px #ffb42e}
.evo-h{margin-top:6px;color:#cdb8ff}
.emo span{position:absolute;bottom:-50px;font-size:28px;opacity:.45;animation:rise 9s linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(40deg)}}
/* ===== GUI v2 ===== */
#hud{background:linear-gradient(180deg,#4a1f9a,#1e0a4a 70%,#150636);border-bottom:2px solid var(--gold);box-shadow:0 10px 28px #000c,inset 0 2px 0 #ffd86b44,inset 0 0 26px #a34dff33}
.chip.ic{width:42px;height:42px;padding:0;justify-content:center;border-radius:50%;font-size:19px;background:radial-gradient(circle at 35% 28%,#9a6af0,#3a1a80);border:2px solid #ffffff55;box-shadow:0 3px 0 #1a0845,inset 0 2px 3px #fff4;transition:transform .1s}
.chip.ic:active{transform:translateY(2px) scale(.94);box-shadow:0 1px 0 #1a0845}
.chip.coin{position:relative;overflow:hidden;border-radius:18px;padding:6px 14px 6px 10px;box-shadow:0 3px 0 #b8660a,0 0 18px #ffb42e88,inset 0 2px 0 #fff9}

<script>
'use strict';
const $=id=>document.getElementById(id);
let LOW=false,RQ=30,FI=16.7,_fc=0,_fn=0,_fa=0,_wi=0,_autoLow=false,_tw=0,_tc=0;

const S={coins:50,xp:0,food:80,en:90,fun:80,hyg:90,wc:20,clicks:0,inventory:[],equippedSkin:0,seenStage:0,fallCount:0,loc:0,locMask:1,mus:1,sfx:1,dirt:0,buffUntil:0,buffMul:1,pc:0,drunk:0,wcv:0,pee:100,ngam:0,nx10:0,crBet:0,crStep:0,crDiff:0,ncr5:0,ach:0,peak:0,nbuy:0,nvom:0,npoop:0,nwash:0,nsleep:0,nrev:0,q:0};
try{const r=JSON.parse(localStorage.getItem('elb4')||'null');if(r&&typeof r==='object'){for(const k in S){if(k==='inventory'){if(Array.isArray(r.inventory))S.inventory=r.inventory.filter(i=>i&&i.count>0&&isFinite(i.food))}else if(typeof r[k]==='number'&&isFinite(r[k]))S[k]=r[k]}}}catch(e){}
let saveT=0;const flush=()=>{saveT=0;if(window.noSave)return;try{localStorage.setItem('elb4',JSON.stringify(S))}catch(e){}};
const save=()=>{if(!saveT)saveT=setTimeout(flush,800)};
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});

const STG=[
  { name: 'Локоть', xp: 0, rarity: 'Обычный', rClass: 'r-common', mult: 1.00 },
  { name: 'Антисистемщик', xp: 150, rarity: 'Обычный', rClass: 'r-common', mult: 1.05 },
  { name: 'Боняра', xp: 450, rarity: 'Обычный', rClass: 'r-common', mult: 1.10 },
  { name: 'Отписанный', xp: 1000, rarity: 'Необычный', rClass: 'r-uncommon', mult: 1.15 },
  { name: 'Алкаш', xp: 2500, rarity: 'Редкий', rClass: 'r-rare', mult: 1.20 },
  { name: 'Наркоман', xp: 3500, rarity: 'Редкий', rClass: 'r-rare', mult: 1.25 },
  { name: 'Волосатый', xp: 5000, rarity: 'Редкий', rClass: 'r-rare', mult: 1.30 }
];

const stage=()=>{let s=0;STG.forEach((a,i)=>{if(S.xp>=a.xp)s=i});return s};
if(!(S.locMask>>S.loc&1))S.loc=0;S.seenStage=Math.max(S.seenStage,stage());S.equippedSkin=Math.min(Math.max(0,S.equippedSkin|0),stage());

let isStarving = S.food <= 0;
let isWeak = false;
let reviveClicks = 0;

let combo = 0;
let lastClickTime = Date.now();
let buffTimer = 0; 
let lastMilestone = 0;

let isFalling = false;
let fallReviveClicks = 0;
let postFallCooldown = 0; 
let clickLock = false; 

let isJumping = false;
let jumpPhase = 0;
let jumpCooldown = 0;

function gain(coins=0,xp=0){
  S.coins+=coins; S.xp+=xp; S.peak=Math.max(S.peak||0,S.coins);
  const ns=stage();
  if(ns>S.seenStage){S.seenStage=ns;S.equippedSkin=ns;isFalling=false;fallReviveClicks=0;showEvo(STG[ns].name);SFX.evo();burst(0,0,140,'conf');vib([30,40,30,40,90])}
  save();
}

function toast(m){
  const d=document.createElement('div');const bad=/^(🤮|💩|💧|🥴|😱|🦠|🪰|🤢|🛏|💥|🥱|😖|🚽 Ему)|упал|Проиграл|Сбила|Не хватает|не мешай|нельзя|занят|Сначала/.test(m),good=/^(✨|✅|😌|💓|🎉|🏆|🥳)/.test(m);d.className='ts'+(bad?' bad':good?' good':'');d.textContent=m;
  $('ts').append(d);while($('ts').children.length>3)$('ts').firstChild.remove();setTimeout(()=>d.remove(),2300);

function tone(f,d,type='sine',v=.1,delay=0,slide=0,mus=false){
  if(mus?!S.mus:!S.sfx)return;if(!mus&&d<.2){const n=performance.now();if(n-_tw>120){_tw=n;_tc=0}if(++_tc>(LOW?2:4))return}const c=ac();if(!c)return;
  try{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+Math.min(.02,d/4));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AU.m);o.start(t);o.stop(t+d+.05)}catch(e){}
}
const vib=p=>{if(S.sfx&&typeof navigator!=='undefined'&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
function noise(dur,f,vol,type='bandpass',q=1,delay=0){
  if(!S.sfx)return;const c=ac();if(!c)return;
  try{if(!AU.nb){const b=c.createBuffer(1,c.sampleRate,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.nb=b}
  const s=c.createBufferSource();s.buffer=AU.nb;s.loop=true;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;
  const g=c.createGain(),t=c.currentTime+delay;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.08,dur/3));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(AU.m);s.start(t);s.stop(t+dur+.05)}catch(e){}
}

  if(S.coins<c){SFX.err();return toast('Не хватает монет!')}
  S.coins-=c;S.nbuy=(S.nbuy||0)+1;
  const ex=S.inventory.find(i=>i.id===id);
  if(ex)ex.count+=1;else S.inventory.push({id,name:d.name,icon:d.icon,food:d.food,count:1});
  hud();save();SFX.buy();stackToast('buy'+id,n=>`${d.icon} ${d.name} x${n}`);openShop(curShop);
};

function openInventoryMenu() {
  let html = '<h2>🎒 Инвентарь</h2>';
  if (!S.inventory || S.inventory.length === 0) { html += '<p style="margin:30px 0;color:#aaa;font-size:18px;font-weight:bold;">Пусто..</p>'; } else {
    html += '<p style="font-size:12px;color:#ffd93daa;margin-bottom:10px;">Твои запасы:</p>';
    S.inventory.forEach((item, index) => {
      html += `<div class="lv"><span style="font-size:28px">${item.icon}</span><b>${item.name} <span style="color:#ffd93d;font-size:16px;margin-left:5px;">x${item.count}</span><small>${invFx(item)}</small></b><div class="actions"><button class="go" onclick="useItem(${index})">Исп.</button><button class="go red" onclick="deleteItem(${index})">Удал.</button></div></div>`;
    });
  }
  html += '<div class="closeBar"><button class="go sec" onclick="ovClose()">Закрыть</button></div>';
  $('box').innerHTML = html; ovShow();
}

window.useItem=index=>{
  const item=S.inventory[index];if(!item)return;const d=ITEM_BY_ID[item.id],c=v=>Math.max(0,Math.min(100,v));
  if(d){
    S.food=c(S.food+d.food);S.en=c(S.en+d.en);S.fun=c(S.fun+d.fun);S.hyg=c(S.hyg+d.hyg);
    if(d.buff){const now=Date.now(),act=S.buffUntil>now;S.buffMul=act?Math.max(S.buffMul,d.buff[0]):d.buff[0];S.buffUntil=Math.min(now+900000,(act?S.buffUntil:now)+d.buff[1]*1000)}
  }else S.food=c(S.food+item.food);
  S.wc=Math.max(0,S.wc-(2+(d?d.food:item.food)*.25+(d&&d.cat!=='f'?3:0)));
  S.pee=Math.max(0,S.pee-(d&&d.cat!=='f'?10+d.fun*.15+(d.cat==='a'?6:0):(d?d.food:item.food)*.2));
  if(d&&d.drunk){const was=S.drunk>0;S.drunk=Math.min(100,S.drunk+d.drunk);if(!was)toast('🥴 Опьянел! Снимается только сном')}
  item.count-=1;if(item.count<=0)S.inventory.splice(index,1);
  if(S.food>0){isStarving=false;isWeak=false;reviveClicks=0;lastMilestone=0}
  hud();save();SFX.buy();toast(`${item.icon} ${item.name}${d&&fxText(d)?' · '+fxText(d):''}`);openInventoryMenu();
};

window.deleteItem = (index) => {
  if (!S.inventory[index]) return;
  S.inventory.splice(index, 1); save(); toast('Выброшено.'); openInventoryMenu();
};

function openSkinsMenu() {
  let html = '<h2>🎭 Коллекция</h2><div class="skin-grid">';
  const currentStage = stage();
  STG.forEach((skin, index) => {
    const isUnlocked = currentStage >= index;
    const isEquipped = S.equippedSkin === index;
    let btn = isUnlocked ? (isEquipped ? `<button class="go sec" style="width:100%;margin-top:5px;" onclick="equipSkin(${index})">Надет</button>` : `<button class="go" style="width:100%;margin-top:5px;" onclick="equipSkin(${index})">Надеть</button>`) : '';
    html += `<div class="skin-card ${isUnlocked ? '' : 'locked'}" style="${isEquipped ? 'border-color:#ffd93d; box-shadow:0 0 10px #ffd93d;' : ''}"><div class="skin-model">${isUnlocked ? getSkinHead(index) : '<div style="width:100%;height:100%;background:#000;border-radius:50%;"></div>'}</div><div class="skin-name">${isUnlocked ? skin.name : '???'}</div>${isUnlocked ? `<div class="skin-mult">${skin.mult.toFixed(2)}x</div>` : ''}<div class="skin-rarity ${skin.rClass}">${isUnlocked ? skin.rarity : 'Скрыто'}</div><div class="skin-xp">${isUnlocked ? (isEquipped ? 'Текущий' : 'Открыт') : `Нужно ${skin.xp} XP`}</div>${btn}</div>`;
  });
  html += '</div><div class="closeBar"><button class="go sec" onclick="ovClose()">Закрыть</button></div>';
  $('box').innerHTML = html; ovShow();
}
window.resetAll=b=>{if(!b.dataset.s){b.dataset.s=1;b.textContent='⚠️ Точно?';setTimeout(()=>{b.dataset.s='';b.textContent='🗑️ Сброс'},2500);return}window.noSave=true;try{localStorage.removeItem('elb4')}catch(e){}location.reload()};

window.equipSkin = (idx) => {
  if (stage() >= idx) {
    S.equippedSkin = idx; SFX.buy();
    isFalling = false; fallReviveClicks = 0; postFallCooldown = 0; clickLock = false; isJumping = false;
    save(); hud(); openSkinsMenu();
  }
};

  if(CR.st==='idle'){
    const ok=b>=10&&b<=S.coins,d=CRD[CR.diff];
    return `<div class="useg crdiff">${CRD.map((x,i)=>`<button class="${CR.diff===i?'on':''}" onclick="crDiff(${i})">${x.n}</button>`).join('')}</div><div class="uchips">${[100,500,1000,5000].map(v=>`<button class="uc ${CR.bet===v?'on':''}" onclick="crAmt(${v})">${v}</button>`).join('')}<button class="uc" onclick="crAmt(Math.floor(S.coins))">ВСЁ</button><button class="uc" onclick="crAmt(CR.bet/2)">½</button><button class="uc" onclick="crAmt(CR.bet*2)">×2</button></div><div class="crhint">Шанс пройти полосу ${Math.round(d.p*100)}% · множитель за прыжок ×${(1/d.p).toFixed(2)}</div><button class="ugo ${ok?'':'dis'}" onclick="crStart()">▶ СТАРТ · 🪙 ${b}</button>${ok?'':`<div class="uhint">${b<10?'Минимальная ставка 10 🪙':'Не хватает монет'}</div>`}`;
  }
  if(CR.st==='run')return `<div class="crbtns"><button class="crjump" onclick="crJump()">⬆ ПРЫЖОК<small>след. ×${fmM(crM(CR.step+1))}</small></button><button class="crcash ${CR.step?'':'dis'}" onclick="crCash()">💰 ЗАБРАТЬ<small>🪙 ${Math.floor(b*crM(CR.step))}</small></button></div>`;
  if(CR.busy||!CR.res)return '';
  return `<div class="crres ${CR.res.win?'w':'l'}">${CR.res.win?`🎉 Забрал +${CR.res.pay} 🪙 (×${fmM(CR.res.m)})`:'💥 Сбила машина! −'+b+' 🪙'}</div><button class="ugo" onclick="crAgain()">🔁 ИГРАТЬ СНОВА</button>`;
}
function crRenderAll(){
  const m=crM(CR.step);
  $('box').innerHTML=`<div class="upg"><div class="uhead"><button class="go sec" onclick="openAzart()">← Азарт</button><div class="ubal" id="crbal">🪙 ${Math.floor(S.coins)}</div></div>${crRoad()}<div class="crinfo"><div><small>Множитель</small><div class="crbig" id="crbig">×${fmM(m)}</div></div><div style="text-align:right"><small>Выплата</small><div class="crpay" id="crpay">🪙 ${Math.floor(CR.bet*m)}</div></div></div><div id="crctl">${crCtl()}</div></div>`;
  ovShow();crCamX(crPadX(CR.step),true);
}
function crUpdate(){
  const m=crM(CR.step),a=$('crbig'),b=$('crpay'),c=$('crctl'),d=$('crbal');
  if(a)a.textContent='×'+fmM(m);if(b)b.textContent='🪙 '+Math.floor(CR.bet*m);if(d)d.textContent='🪙 '+Math.floor(S.coins);
  if(c)c.innerHTML=crCtl();
  for(let i=1;i<=CRN;i++){const e=$('crb'+i);if(e&&e.classList)e.classList.toggle('ok',i<=CR.step)}
}
window.openCrash=()=>{if(CR.st==='over'){CR.st='idle';CR.step=0;CR.res=null}crRenderAll()};
window.crDiff=i=>{if(CR.st!=='idle')return;CR.diff=i;crRenderAll()};
window.crAmt=v=>{if(CR.st!=='idle')return;CR.bet=Math.max(10,Math.floor(v));crUpdate()};
window.crAgain=()=>{if(CR.busy)return;CR.st='idle';CR.step=0;CR.res=null;crRenderAll()};
window.crStart=()=>{
  if(CR.busy||CR.st==='run')return;
  if(CR.bet<10){SFX.err();return toast('Минимальная ставка 10 🪙')}
  if(CR.bet>S.coins){SFX.err();return toast('Не хватает монет!')}
  S.coins-=CR.bet;S.crBet=CR.bet;S.crStep=0;S.crDiff=CR.diff;S.ngam=(S.ngam||0)+1;
  CR.st='run';CR.step=0;CR.res=null;CR.crashAt=0;
  const p=CRD[CR.diff].p;for(let i=1;i<=CRN;i++)if(Math.random()>p){CR.crashAt=i;break}
  hud();save();SFX.up();crRenderAll();
};
function crAnim(el,fr,o,cb){
  if(!el){cb();return}
  const a=el.animate?el.animate(fr,Object.assign({fill:'forwards'},o)):null;
  if(a)a.onfinish=()=>cb(a);else setTimeout(()=>cb(),o.duration);
}
window.crJump=()=>{
  if(CR.st!=='run'||CR.busy)return;
  const from=CR.step,to=from+1,crash=CR.crashAt===to;CR.busy=true;SFX.up();
  const el=$('crel'),y=CRY-22,x0=crPadX(from)-22;
  if(!crash){
    CR.step=to;S.crStep=to;save();const x1=crPadX(to)-22;crCamX(crPadX(to));
    crAnim(el,[{transform:`translate(${x0}px,${y}px) scale(1,1)`},{transform:`translate(${(x0+x1)/2}px,${y-48}px) scale(.9,1.14)`,offset:.5},{transform:`translate(${x1}px,${y}px) scale(1.14,.86)`,offset:.88},{transform:`translate(${x1}px,${y}px) scale(1,1)`}],{duration:380,easing:'ease-in-out'},a=>{
      if(el)el.style.transform=`translate(${x1}px,${y}px)`;if(a)a.cancel();SFX.buy();
      if(to===CRN){CR.busy=false;crCash(true)}else{CR.busy=false;crUpdate()}
    });
  }else{
    S.crBet=0;CR.st='over';CR.res={win:false};save();
    const tr=$('crtrack'),xl=crLaneX(to)-22;crCamX(crLaneX(to));
    crAnim(el,[{transform:`translate(${x0}px,${y}px) scale(1,1)`},{transform:`translate(${(x0+xl)/2}px,${y-44}px) scale(.9,1.12)`,offset:.55},{transform:`translate(${xl}px,${y}px) scale(1,1)`}],{duration:240,easing:'ease-out'},()=>{});
    const car=document.createElement('div');car.className='crcar hit';car.style.left=(crLaneX(to)-15)+'px';car.innerHTML=CAR('#e33');
    if(tr&&tr.appendChild){tr.appendChild(car);if(car.animate)car.animate([{transform:'translateY(-100px)'},{transform:`translateY(${CRY-34}px)`}],{duration:320,easing:'ease-in',fill:'forwards'})}
    tone(220,.28,'square',.08);
    setTimeout(()=>{
      SFX.fall();shake();
      if(tr&&tr.appendChild){const bm=document.createElement('div');bm.className='crboom';bm.textContent='💥';bm.style.left=(xl-4)+'px';bm.style.top=(CRY-34)+'px';tr.appendChild(bm);if(bm.animate)bm.animate([{transform:'scale(.3)',opacity:1},{transform:'scale(1.5)',opacity:0}],{duration:450,fill:'forwards'})}
      if(car.animate)car.animate([{transform:`translateY(${CRY-34}px)`},{transform:'translateY(260px)'}],{duration:300,fill:'forwards'});
      crAnim(el,[{transform:`translate(${xl}px,${y}px) rotate(0deg) scale(1)`,opacity:1},{transform:`translate(${xl+50}px,${y+120}px) rotate(620deg) scale(.5)`,opacity:0}],{duration:650,easing:'ease-out'},()=>{CR.busy=false;crUpdate()});
    },320);
  }
};
window.crCash=full=>{
  if(CR.st!=='run'||CR.step<1||(CR.busy&&!full))return;
  const m=crM(CR.step),pay=Math.floor(CR.bet*m);
  S.coins+=pay;S.peak=Math.max(S.peak||0,S.coins);S.crBet=0;if(m>=5)S.ncr5=(S.ncr5||0)+1;
  CR.st='over';CR.res={win:true,pay,m};
  SFX.evo();burst(0,0,full?140:80,'conf');vib([40,40,80]);toast(`🎉 Забрал +${pay} 🪙 (×${fmM(m)})`);
  hud();save();crUpdate();
};
function crRecover(){
  if(S.crBet>0){const m=crM(S.crStep||0,S.crDiff||0),pay=Math.floor(S.crBet*m);S.coins+=pay;S.crBet=0;save();setTimeout(()=>toast(`🚗 Раунд завершён: +${pay} 🪙`),600)}
}

const FP=[];let fpi=0;
function floatTxt(e,text){
  if(!FP.length){const h=document.createElement('div');document.body.appendChild(h);for(let i=0;i<10;i++){const d=document.createElement('div');d.className='floating-text';h.appendChild(d);FP.push(d)}}
  const d=FP[fpi=(fpi+1)%FP.length];if(d._a)d._a.cancel();
  d.textContent=text;const x=e.clientX-30,y=e.clientY-20;
  d._a=d.animate([{transform:`translate(${x}px,${y}px) scale(1)`,opacity:1},{transform:`translate(${x}px,${y-80}px) scale(1.4)`,opacity:0}],{duration:750,easing:'ease-out',fill:'forwards'});
}
function ringPulse(){const r=$('ring');if(r.animate)r.animate([{transform:'scale(1)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:180})}
function svgPt(e){
  const k=Math.min(SR.w/VW,SR.h/VH),ox=(SR.w-VW*k)/2,oy=SR.h-VH*k,cx=camShown>=0?camShown:camX;
  return{x:cx+(e.clientX-SR.l-ox)/k,y:VY+(e.clientY-SR.t-oy)/k};
}
function moveNozzle(e){const p=svgPt(e);if(!p)return;nx=Math.min(camX+VW-40,Math.max(camX+40,p.x));ny=Math.min(470,Math.max(70,p.y))}
const skipTap=e=>e.target.closest&&e.target.closest('button,#ov,#menu,#xb');

window.addEventListener('pointermove',e=>{if(shower&&drag){e.preventDefault();moveNozzle(e)}},{passive:false});
['pointerup','pointercancel'].forEach(n=>window.addEventListener(n,()=>{drag=false}));
window.addEventListener('pointerdown',e=>{
  if(!started||skipTap(e))return;
  if(shower&&!suspended){drag=true;moveNozzle(e);return}
  if(mode===2){const q=svgPt(e);if(q&&q.x>bedX0-30&&q.x<bedX0+bedW+30&&q.y>480&&q.y<715)bedHit();return}
  if(mode===3)return;
  if(mode>=9){floatTxt(e,mode===11?'🤮':mode===12?'💧':mode===10?'💩':'🚽');return}
  if(mode>=5&&mode<=7){floatTxt(e,'💤');return}
  if(clickLock)return;
  const p=svgPt(e);if(!p)return;
  const hitC=lying()?(p.x>charX-445&&p.x<charX+55&&p.y>535):(Math.abs(p.x-curRx)<175&&Math.abs(p.y-(470-curJy))<275);
  if(!hitC)return;
  const st=S.equippedSkin||0;

  if(isStarving){
    reviveClicks++;bounce=.6;SFX.zap();ringPulse();floatTxt(e,'⚡');stKey=null;
    if(reviveClicks>=40){isStarving=false;isWeak=true;S.nrev=(S.nrev||0)+1;S.food=45;SFX.evo();toast('💓 Откачали!');hud();save()}
    return;
  }
  if(isFalling){
    fallReviveClicks++;bounce=.6;SFX.click();ringPulse();floatTxt(e,'⬆');stKey=null;
    if(fallReviveClicks>=10){isFalling=false;fallReviveClicks=0;SFX.up();toast('Он встал!')}
    return;
  }
  if(itching()){bounce=.5;SFX.err();floatTxt(e,'🦠 Помой его!');return}
  if(isWeak){bounce=1;SFX.click();gain(1,0);floatTxt(e,'+1 🪙 мелочь');return}

  lastClickTime=Date.now();combo++;
  if((st===4||st===5)&&++S.fallCount>=200){
    S.fallCount=0;isFalling=true;fallReviveClicks=0;clickLock=true;combo=0;buffTimer=0;lastMilestone=0;stKey=null;
    setTimeout(()=>{clickLock=false},300);SFX.fall();shake();toast('Он споткнулся и упал!');save();return;
  }
  const ms=Math.floor(combo/CS);
  if(ms>lastMilestone){
    buffTimer=4;lastMilestone=ms;SFX.up();
    toast(combo>=CS*3?'🔥 ПОДГОРАЕТ! x2.5':'💥 СУПЕР-КЛИКИ x2!');
  }
  let mult=STG[st].mult*LOC().mult*(DS>=0?[.95,.92,.9,.88][Math.min(DS,3)]:1)*(Date.now()<S.buffUntil?S.buffMul:1)*(1-POOP_PEN*pCount());
  if(buffTimer>0)mult*=(combo>=CS*3?2.5:2);
  S.clicks=(S.clicks||0)+1;
  S.food=Math.max(0,+(S.food-LOC().drain).toFixed(3));
  S.hyg=Math.max(0,+(S.hyg-.05-.02*pCount()).toFixed(3));S.wc=Math.max(0,+(S.wc-.04).toFixed(3));S.pee=Math.max(0,+(S.pee-.05).toFixed(3));
  gain(mult,mult);
  bounce=1;const np=performance.now();if(np-_tS>(LOW?120:70)){_tS=np;SFX.click()}
  if(S.food<=0){isStarving=true;reviveClicks=0;combo=0;buffTimer=0;lastMilestone=0;stKey=null;SFX.fall()}
  if(np-_tF>(LOW?160:100)){_tF=np;floatTxt(e,`+${mult.toFixed(2)} 🪙`)}
  if(np-_tP>(LOW?220:150)){_tP=np;const hcc=$('hcc');if(hcc.animate)hcc.animate([{transform:'scale(1)'},{transform:'scale(1.07)'},{transform:'scale(1)'}],{duration:130})}
});
$('ov').addEventListener('pointerdown',e=>{if(e.target===$('ov'))ovClose()});

// Блокировка зума
['gesturestart','gesturechange','gestureend','dblclick'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['+','-','=','0','_'].includes(e.key))e.preventDefault()});
document.addEventListener('contextmenu',e=>e.preventDefault());

$('mhead').innerHTML=getSkinHead(S.equippedSkin||0);
if(S.clicks>0)$('mplay').textContent='▶ ПРОДОЛЖИТЬ';
syncSnd();initScene();renderPoops();crRecover();
requestAnimationFrame(updateCharacter);
hud();

function applyQ(){LOW=S.q===1||(S.q===0&&_autoLow);document.documentElement.classList.toggle('lo',LOW);RQ=LOW?20:30;FI=LOW?33:16.7;const b=$('mq');if(b)b.textContent='🖼️ Графика: '+['Авто'+(_autoLow?' (низкая)':''),'Низкая','Высокая'][S.q]}
function cycleQ(){S.q=(S.q+1)%3;if(S.q===0)_autoLow=false;_fn=0;_fa=0;_wi=0;applyQ();save()}
applyQ();

// ===== PWA: сохранение, установка, обновления =====
const APP_V='1';
window.exportSave=()=>{
  flush();
  let d='';try{d=localStorage.getItem('elb4')||''}catch(e){}
  if(!d)return toast('Нечего экспортировать');
  const code=btoa(unescape(encodeURIComponent(d)));
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(()=>toast('✅ Код сохранения скопирован'),()=>prompt('Скопируй код сохранения:',code));
  }else prompt('Скопируй код сохранения:',code);
};
window.importSave=()=>{
  const code=prompt('Вставь код сохранения:');
  if(!code)return;
  try{
    const json=decodeURIComponent(escape(atob(code.trim())));
    const o=JSON.parse(json);
    if(!o||typeof o!=='object'||typeof o.coins!=='number')throw 0;
    window.noSave=true;
    localStorage.setItem('elb4',json);
    location.reload();
  }catch(e){window.noSave=false;toast('Неверный код сохранения')}
};
if('serviceWorker' in navigator){
  addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
    }).catch(()=>{});
  });
}
let _vc=0;
async function checkUpdate(){
  if(Date.now()-_vc<60000)return;_vc=Date.now();
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});
    const j=await r.json();
    if(j&&j.v&&String(j.v)!==APP_V&&!$('updbar')){
      const b=document.createElement('button');b.id='updbar';
      b.textContent='🔄 Вышло обновление — нажми, чтобы обновить';
      b.style.cssText='position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9999;background:#ffd86b;color:#4a2c00;border:2px solid #fff;border-radius:16px;padding:10px 16px;font-weight:800;font-size:14px;box-shadow:0 4px 18px #000a;max-width:92%';
      b.onclick=()=>{flush();window.noSave=true;location.reload()};
      document.body.appendChild(b);
    }
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});
addEventListener('load',()=>setTimeout(checkUpdate,4000));
</script>
